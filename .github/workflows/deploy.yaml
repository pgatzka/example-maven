name: Deploy

run-name: >
  ${{ github.workflow }}: ${{ github.event_name }} for ${{ github.ref_name }} by @${{ github.actor }} on ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy"
        type: string
        required: true
      environment:
        description: "Target environment"
        type: choice
        required: true
        options: [ ci, production ]
  workflow_call:
    inputs:
      image_tag:
        description: "Image tag to deploy"
        type: string
        required: true
      environment:
        description: "Target environment"
        type: string
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: [ self-hosted, "${{ github.event.repository.name }}-${{ inputs.environment }}" ]
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy
        env:
          IMAGE: ${{ vars.IMAGE_NAME }}
          TAG: ${{ inputs.image_tag }}
          TRIGGER_SHA: ${{ github.sha }}
          SERVICE: ${{ vars.COMPOSE_SERVICE }}
          COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
          COMPOSE_FILE: ${{ vars.COMPOSE_FILE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_DIRECTORY: ${{ vars.DEPLOYMENT_DIRECTORY }}
          KEEP_RELEASES: ${{ vars.KEEP_RELEASES }}
          HEALTH_TIMEOUT: ${{ vars.HEALTH_TIMEOUT }}
          HEALTH_INTERVAL: ${{ vars.HEALTH_INTERVAL }}
          # To pass environment variables to the docker compose, list them here
        run: .github/scripts/deploy.sh